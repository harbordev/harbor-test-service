name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target deployment environment"
        required: true
        type: string
      project:
        description: "Harbor project ID"
        required: true
        type: string
      service:
        description: "Harbor service ID"
        required: true
        type: string
      deployment_id:
        description: "Harbor deployment ID"
        required: true
        type: string
      version:
        description: "Target version, branch, or tag"
        required: true
        type: string
      commit_sha:
        description: "Target Git commit SHA"
        required: false
        type: string

jobs:
  deploy:
    name: Build & Validate Service
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha != '' && inputs.commit_sha || inputs.version }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run Pytest Suite
        run: |
          pytest

      - name: Build Docker Container
        run: |
          echo "Building container for deployment ${{ inputs.deployment_id }} (${{ inputs.environment }})"
          docker build \
            --build-arg GIT_COMMIT_SHA="${{ inputs.commit_sha }}" \
            -t harbor-test-service:${{ inputs.version }} \
            -t harbor-test-service:latest .

      - name: Verify Container Health
        run: |
          docker run -d --name test-app -p 8000:8000 \
            -e ENVIRONMENT="${{ inputs.environment }}" \
            -e HARBOR_PROJECT_ID="${{ inputs.project }}" \
            -e HARBOR_SERVICE_ID="${{ inputs.service }}" \
            -e HARBOR_DEPLOYMENT_ID="${{ inputs.deployment_id }}" \
            -e GIT_COMMIT_SHA="${{ inputs.commit_sha }}" \
            harbor-test-service:latest

          sleep 3
          curl --fail http://localhost:8000/health/live
          docker rm -f test-app
